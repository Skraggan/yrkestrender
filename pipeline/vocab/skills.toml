# Kompetenser och andra begrepp som räknas i jobbannonser.
#
# Varje kategori har ett namn och en tabell "skills" där nyckeln är det namn som
# visas på sajten och värdet är en lista med söktermer.
#
# Termer skrivs med gemener. Bindestreck och snedstreck delar ord i annonserna,
# så "B-körkort" skrivs "b körkort". Termer får vara 1–4 ord.
# Ett avslutande * lägger till vanliga svenska böjningsformer på sista ordet
# (truckkort* -> truckkort, truckkortet, truckkorten ...).
# Specialformer: c# -> csharp, c++ -> cplusplus, .net -> dotnet.
#
# Varje term sparas per annons, så att flytta en term mellan kompetenser eller
# slå ihop kompetenser kräver ingen ny genomläsning av annonserna. Bara helt
# nya termer gör det.

# Varje kategori hör till en av fyra sorter, som visas och jämförs var för sig:
#   kompetens  vad man ska kunna göra (yrkeskunskaper, verktyg, metoder)
#   krav       förutsättningar: körkort, behörigheter, utbildning, legitimation, språk, kontroller
#   egenskap   personliga egenskaper
#   villkor    anställningsvillkor och förmåner
[kinds]
kompetens = "Kompetenser"
krav = "Krav och behörigheter"
egenskap = "Personliga egenskaper"
villkor = "Villkor och förmåner"

